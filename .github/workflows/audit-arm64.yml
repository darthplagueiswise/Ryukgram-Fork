name: Audit ARM64 with r2 and Capstone

on:
  push:
    branches: [experimental3]
    paths:
      - '.github/workflows/audit-arm64.yml'
      - 'tools/reverse/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install radare2 6.1.8 and Capstone 5
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            -o /tmp/radare2.deb \
            https://github.com/radareorg/radare2/releases/download/6.1.8/radare2_6.1.8_amd64.deb
          echo '1849eac17f542571c4f4bb333ec05d36f52c6b698548fb522e9f3794583b3880  /tmp/radare2.deb' | sha256sum -c -
          sudo apt-get update
          sudo apt-get install -y /tmp/radare2.deb
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'capstone==5.0.7'
          r2 -v
          python3 -c 'import capstone; print(capstone.__version__)'

      - name: Verify hash-scoped instructions with both decoders
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/reverse/verify_arm64_audit.py \
            tools/reverse/arm64-audit-fixtures.json \
            --output arm64-audit-results.md

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-r2-capstone-audit
          path: arm64-audit-results.md
          if-no-files-found: error
