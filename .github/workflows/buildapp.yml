name: Build and Package RyukGram

on:
    workflow_dispatch:
        inputs:
            decrypted_instagram_url:
                description: "Direct URL to the decrypted Instagram IPA (only needed for sideload/no-plugins/TrollStore)"
                default: ""
                required: false
                type: string
            build_sideload:
                description: "Build sideload IPA"
                default: true
                required: false
                type: boolean
            build_noplugins:
                description: "Build no-plugins IPA"
                default: false
                required: false
                type: boolean
            dup_bundle_id:
                description: "No-plugins: install as this bundle id (side-by-side dup). Blank = normal com.burbn.instagram."
                default: ""
                required: false
                type: string
            dup_name:
                description: "App display name on the home screen (applies to sideload + no-plugins; blank = default RyukGram for a dup, unchanged otherwise)."
                default: ""
                required: false
                type: string
            build_trollstore:
                description: "Build TrollStore .tipa"
                default: false
                required: false
                type: boolean
            build_trollfools:
                description: "Build TrollFools zip"
                default: false
                required: false
                type: boolean
            build_rootless:
                description: "Build rootless .deb"
                default: false
                required: false
                type: boolean
            build_rootful:
                description: "Build rootful .deb"
                default: false
                required: false
                type: boolean
            build_dylib:
                description: "Build standalone RyukGram.dylib"
                default: false
                required: false
                type: boolean
            build_zxinject:
                description: "Build standalone zxPluginsInject.dylib"
                default: false
                required: false
                type: boolean
            upload_artifact:
                description: "Upload artifacts"
                default: true
                required: false
                type: boolean

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    build:
        name: Build RyukGram
        runs-on: macos-latest
        permissions:
            contents: write

        steps:
            - name: Validate selection
              run: |
                if [ "${{ inputs.build_sideload }}" != "true" ] && \
                   [ "${{ inputs.build_noplugins }}" != "true" ] && \
                   [ "${{ inputs.build_trollstore }}" != "true" ] && \
                   [ "${{ inputs.build_trollfools }}" != "true" ] && \
                   [ "${{ inputs.build_rootless }}" != "true" ] && \
                   [ "${{ inputs.build_rootful }}" != "true" ] && \
                   [ "${{ inputs.build_dylib }}" != "true" ] && \
                   [ "${{ inputs.build_zxinject }}" != "true" ]; then
                  echo "::error::Select at least one build variant."
                  exit 1
                fi
                if { [ "${{ inputs.build_sideload }}" = "true" ] || \
                     [ "${{ inputs.build_noplugins }}" = "true" ] || \
                     [ "${{ inputs.build_trollstore }}" = "true" ]; } && \
                   [ -z "${{ inputs.decrypted_instagram_url }}" ]; then
                  echo "::error::sideload / no-plugins / TrollStore builds need decrypted_instagram_url."
                  exit 1
                fi

            - name: Checkout Main
              uses: actions/checkout@v4
              with:
                path: main
                submodules: recursive

            - name: Install Dependencies
              run: brew install ldid dpkg make

            - name: Set PATH environment variable
              run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

            - name: Install IPA tooling (cyan + ipapatch)
              run: |
                pip install --force-reinstall https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
                mkdir -p "$HOME/.local/bin"
                curl -Lo "$HOME/.local/bin/ipapatch" https://github.com/asdfzxcvbn/ipapatch/releases/download/v2.1.3/ipapatch.macos-arm64
                chmod +x "$HOME/.local/bin/ipapatch"
                echo "$HOME/.local/bin" >> "$GITHUB_PATH"

            - name: Setup Theos
              uses: actions/checkout@v4
              with:
                repository: theos/theos
                ref: master
                path: ${{ github.workspace }}/theos
                submodules: recursive

            - name: SDK Caching
              id: SDK
              uses: actions/cache@v4
              env:
                cache-name: iPhoneOS26.5.sdk
              with:
                path: ${{ github.workspace }}/theos/sdks/
                key: ${{ env.cache-name }}
                restore-keys: ${{ env.cache-name }}

            - name: Download iOS SDK
              if: steps.SDK.outputs.cache-hit != 'true'
              run: |
                git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
                cd iOS-SDKs
                git sparse-checkout set --no-cone iPhoneOS26.5.sdk
                git checkout
                mv *.sdk $THEOS/sdks
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Prepare Instagram IPA
              if: ${{ inputs.build_sideload || inputs.build_noplugins || inputs.build_trollstore }}
              run: |
                cd main
                mkdir -p packages
                wget "$Instagram_URL" --no-verbose -O packages/com.burbn.instagram.ipa
                ls -la packages
              env:
                THEOS: ${{ github.workspace }}/theos
                Instagram_URL: ${{ inputs.decrypted_instagram_url }}

            - name: Get Version
              id: version
              run: |
                VERSION=$(awk '/Version:/ {print $2}' main/control)
                IG_VER=$(head -1 main/IG_VERSION 2>/dev/null | tr -d ' \t\r\n')
                [ -n "$IG_VER" ] || IG_VER=unknown
                echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
                echo "IG_VER=${IG_VER}" >> "$GITHUB_ENV"
                echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

            - name: Setup FFmpegKit
              run: cd main && ./scripts/setup-ffmpegkit.sh

            - name: Build sideload IPA
              if: ${{ inputs.build_sideload }}
              run: |
                cd main
                ./build.sh sideload ${DUP_NAME:+--name "$DUP_NAME"}
                ls -la packages
              env:
                THEOS: ${{ github.workspace }}/theos
                DUP_NAME: ${{ inputs.dup_name }}

            - name: Build no-plugins IPA
              if: ${{ inputs.build_noplugins }}
              run: |
                cd main
                if [ -n "$DUP_ID" ]; then
                  ./build.sh noplugins --dup "$DUP_ID" ${DUP_NAME:+--name "$DUP_NAME"}
                else
                  ./build.sh noplugins
                fi
                ls -la packages
              env:
                THEOS: ${{ github.workspace }}/theos
                DUP_ID: ${{ inputs.dup_bundle_id }}
                DUP_NAME: ${{ inputs.dup_name }}

            - name: Build TrollStore .tipa
              if: ${{ inputs.build_trollstore }}
              run: |
                cd main
                ./build.sh trollstore
                ls -la packages
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Build TrollFools zip
              if: ${{ inputs.build_trollfools }}
              run: |
                cd main
                ./build.sh trollfools
                ls -la packages
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Build rootless deb
              if: ${{ inputs.build_rootless }}
              run: |
                cd main
                ./build.sh rootless
                ls -la packages
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Build rootful deb
              if: ${{ inputs.build_rootful }}
              run: |
                cd main
                ./build.sh rootful
                ls -la packages
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Build standalone RyukGram.dylib
              if: ${{ inputs.build_dylib }}
              run: |
                cd main
                ./build.sh dylib
                mv packages/RyukGram.dylib "packages/RyukGram_v${VERSION}.dylib"
                ls -la packages
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Build standalone zxPluginsInject.dylib
              if: ${{ inputs.build_zxinject }}
              run: |
                cd main
                make -C modules/zxPluginsInject FINALPACKAGE=1
                cp modules/zxPluginsInject/.theos/obj/zxPluginsInject.dylib "packages/zxPluginsInject_v${VERSION}.dylib"
                install_name_tool -id "@rpath/zxPluginsInject.dylib" "packages/zxPluginsInject_v${VERSION}.dylib" || true
                ls -la packages
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Upload sideload IPA
              if: ${{ inputs.upload_artifact && inputs.build_sideload }}
              uses: actions/upload-artifact@v4
              with:
                name: RyukGram_sideload_v${{ steps.version.outputs.version }}
                path: ${{ github.workspace }}/main/packages/RyukGram_sideload_v*.ipa
                if-no-files-found: error

            - name: Upload no-plugins IPA
              if: ${{ inputs.upload_artifact && inputs.build_noplugins }}
              uses: actions/upload-artifact@v4
              with:
                name: RyukGram_noplugins_v${{ steps.version.outputs.version }}
                path: ${{ github.workspace }}/main/packages/RyukGram_noplugins_v*.ipa
                if-no-files-found: error

            - name: Upload TrollStore .tipa
              if: ${{ inputs.upload_artifact && inputs.build_trollstore }}
              uses: actions/upload-artifact@v4
              with:
                name: RyukGram_trollstore_v${{ steps.version.outputs.version }}
                path: ${{ github.workspace }}/main/packages/RyukGram_trollstore_v*.tipa
                if-no-files-found: error

            - name: Upload TrollFools zip
              if: ${{ inputs.upload_artifact && inputs.build_trollfools }}
              uses: actions/upload-artifact@v4
              with:
                name: RyukGram_trollfools_v${{ steps.version.outputs.version }}
                path: ${{ github.workspace }}/main/packages/RyukGram_trollfools_*.zip
                if-no-files-found: error

            - name: Upload rootless deb
              if: ${{ inputs.upload_artifact && inputs.build_rootless }}
              uses: actions/upload-artifact@v4
              with:
                name: RyukGram_v${{ steps.version.outputs.version }}_rootless
                path: ${{ github.workspace }}/main/packages/RyukGram_${{ env.VERSION }}_IG*_rootless.deb
                if-no-files-found: error

            - name: Upload rootful deb
              if: ${{ inputs.upload_artifact && inputs.build_rootful }}
              uses: actions/upload-artifact@v4
              with:
                name: RyukGram_v${{ steps.version.outputs.version }}_rootful
                path: ${{ github.workspace }}/main/packages/RyukGram_${{ env.VERSION }}_IG*_rootful.deb
                if-no-files-found: error

            - name: Upload RyukGram.dylib
              if: ${{ inputs.upload_artifact && inputs.build_dylib }}
              uses: actions/upload-artifact@v4
              with:
                name: RyukGram_dylib_v${{ steps.version.outputs.version }}
                path: ${{ github.workspace }}/main/packages/RyukGram_v*.dylib
                if-no-files-found: error

            - name: Upload zxPluginsInject.dylib
              if: ${{ inputs.upload_artifact && inputs.build_zxinject }}
              uses: actions/upload-artifact@v4
              with:
                name: zxPluginsInject_dylib_v${{ steps.version.outputs.version }}
                path: ${{ github.workspace }}/main/packages/zxPluginsInject_v*.dylib
                if-no-files-found: error
