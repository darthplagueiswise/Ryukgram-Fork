name: Build RyukGramPrivExp (rootless)

on:
    push:
        branches:
            - '**'
    pull_request:
        branches:
            - '**'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build RyukGramPrivExp (rootless)
        runs-on: macos-latest
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                submodules: recursive
                fetch-depth: 0

            - name: Clean Homebrew runner taps
              run: |
                brew untap aws/tap || true
                brew untap azure/bicep || true

            - name: Install Dependencies
              run: brew install ldid dpkg make

            - name: Set PATH
              run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

            - name: Setup Theos
              uses: actions/checkout@v6
              with:
                repository: theos/theos
                ref: master
                path: ${{ github.workspace }}/theos
                submodules: recursive

            - name: SDK Caching
              id: SDK
              uses: actions/cache@v5
              env:
                cache-name: iPhoneOS26.2.sdk
              with:
                path: ${{ github.workspace }}/theos/sdks/
                key: ${{ runner.os }}-${{ env.cache-name }}
                restore-keys: |
                  ${{ runner.os }}-${{ env.cache-name }}

            - name: Download iOS SDK
              if: steps.SDK.outputs.cache-hit != 'true'
              run: |
                git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
                cd iOS-SDKs
                git sparse-checkout set --no-cone iPhoneOS26.2.sdk
                git checkout
                mv *.sdk $THEOS/sdks
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Set test package version
              id: version
              run: |
                BASE_VERSION=$(awk '/Version:/ {print $2}' control)
                CLEAN_REF="${GITHUB_REF_NAME//\//-}"
                BUILD_VERSION="${BASE_VERSION}.0.0.${GITHUB_RUN_NUMBER}"
                PACKAGE_NAME="RyukGramPrivExp_${CLEAN_REF}_${BUILD_VERSION}_rootless.deb"
                sed -i '' "s/^Version:.*/Version: ${BUILD_VERSION}/" control
                echo "BASE_VERSION=${BASE_VERSION}" >> "$GITHUB_ENV"
                echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
                echo "CLEAN_REF=${CLEAN_REF}" >> "$GITHUB_ENV"
                echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_ENV"
                echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
                echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
                echo "clean_ref=${CLEAN_REF}" >> "$GITHUB_OUTPUT"
                echo "package_name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
                echo "Using package version ${BUILD_VERSION}"
                grep '^Version:' control

            - name: Setup FFmpegKit
              run: ./scripts/setup-ffmpegkit.sh

            - name: Build rootless deb
              run: |
                export THEOS="${{ github.workspace }}/theos"
                ./build.sh rootless
                cd packages
                DEB="$(ls -t *-rootless.deb | head -n1)"
                [ -n "$DEB" ] && mv "$DEB" "$PACKAGE_NAME"
                ls -la

            - name: Upload rootless artifact
              uses: actions/upload-artifact@v6
              with:
                name: RyukGramPrivExp_${{ steps.version.outputs.clean_ref }}_v${{ steps.version.outputs.build_version }}_rootless
                path: packages/${{ steps.version.outputs.package_name }}
                if-no-files-found: error
