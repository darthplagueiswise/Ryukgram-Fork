name: Build RyukGram dogfood · SDK 26.5

on:
  push:
    branches: [dogfood]
  pull_request:
    branches: [dogfood]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Rootless + rootful · arm64
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout dogfood source
        uses: actions/checkout@v4
        with:
          path: main
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Cache iPhoneOS 26.5 SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos/sdks/iPhoneOS26.5.sdk
          key: ${{ runner.os }}-iPhoneOS26.5.sdk-v1

      - name: Download iPhoneOS 26.5 SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs sdk-source
          cd sdk-source
          git sparse-checkout set --no-cone iPhoneOS26.5.sdk
          git checkout
          mv iPhoneOS26.5.sdk "$THEOS/sdks/"

      - name: Setup FFmpegKit
        working-directory: main
        run: ./scripts/setup-ffmpegkit.sh

      - name: Build rootless package
        working-directory: main
        shell: bash
        run: |
          set -o pipefail
          ./build.sh rootless 2>&1 | tee "$RUNNER_TEMP/ryg-rootless-build.log"

      - name: Name rootless artifact
        working-directory: main
        run: |
          VERSION="$(awk '/^Version:/ {print $2}' control)"
          DEB="$(ls -t packages/*_rootless.deb | head -n1)"
          mv "$DEB" "packages/RyukGram_${VERSION}+dogfood.${GITHUB_RUN_NUMBER}_rootless.deb"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build rootful package
        working-directory: main
        shell: bash
        run: |
          set -o pipefail
          ./build.sh rootful 2>&1 | tee "$RUNNER_TEMP/ryg-rootful-build.log"

      - name: Name rootful artifact
        working-directory: main
        run: |
          DEB="$(ls -t packages/*_rootful.deb | head -n1)"
          mv "$DEB" "packages/RyukGram_${VERSION}+dogfood.${GITHUB_RUN_NUMBER}_rootful.deb"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RyukGram_build_logs_${{ github.run_number }}
          path: |
            ${{ runner.temp }}/ryg-rootless-build.log
            ${{ runner.temp }}/ryg-rootful-build.log
          if-no-files-found: ignore

      - name: Upload dogfood packages
        uses: actions/upload-artifact@v4
        with:
          name: RyukGram_dogfood_${{ env.VERSION }}_${{ github.run_number }}
          path: |
            main/packages/RyukGram_*_rootless.deb
            main/packages/RyukGram_*_rootful.deb
          if-no-files-found: error
