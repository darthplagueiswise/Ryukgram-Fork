name: Build RyukGram debug · rootless · SDK 26.5

on:
  push:
    branches: [debug]
  pull_request:
    branches: [debug]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Rootless · arm64 · SDK 26.5
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      THEOS: ${{ github.workspace }}/theos
      RYG_LOGOS_REV: a62370066a97e36d59b200a9fa10c5091f5e8972

    steps:
      - name: Checkout debug source
        uses: actions/checkout@v4
        with:
          path: main
          fetch-depth: 0
          submodules: recursive

      - name: Refuse stale pre-main2 source trees
        working-directory: main
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^Version:[[:space:]]*1\.3\.4$' control
          test -f IG_VERSION
          test "$(tr -d '[:space:]' < IG_VERSION)" = "444.0.0"
          test -f src/RYGPrefix.h
          test -d src/Background
          test -d src/Debug
          test -d src/Gallery
          test -d src/Lock
          test -d src/Observers
          test -d src/Security
          test -d src/UI
          test -f src/Features/General/ProfileCopyButton.x_
          test ! -e src/Features/General/ProfileCopyButton.x
          test -f src/Features/ExpFlags/ExpFlagsHooks.xm_
          test ! -e src/Features/ExpFlags/ExpFlagsHooks.xm
          grep -Fq -- '-include src/RYGPrefix.h' Makefile
          if grep -Fq 'modules/JGProgressHUD/*.m' Makefile; then
            echo '::error::Stale overlay detected: JGProgressHUD was re-added only because disabled ZIP sources were left active.'
            exit 1
          fi
          echo 'RyukGramPriv-main2 source identity checks passed.'

      - name: Install build dependencies
        run: |
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Pin legacy-compatible Logos parser
        shell: bash
        run: |
          set -euo pipefail
          git -C "$THEOS/vendor/logos" fetch --depth=1 origin "$RYG_LOGOS_REV"
          git -C "$THEOS/vendor/logos" checkout --detach "$RYG_LOGOS_REV"
          ACTUAL="$(git -C "$THEOS/vendor/logos" rev-parse HEAD)"
          test "$ACTUAL" = "$RYG_LOGOS_REV"
          echo "Using Logos $ACTUAL"

      - name: Cache iPhoneOS 26.5 SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos/sdks/iPhoneOS26.5.sdk
          key: ${{ runner.os }}-iPhoneOS26.5.sdk-v1

      - name: Download iPhoneOS 26.5 SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs sdk-source
          cd sdk-source
          git sparse-checkout set --no-cone iPhoneOS26.5.sdk
          git checkout
          mv iPhoneOS26.5.sdk "$THEOS/sdks/"

      - name: Verify SDK and Logos
        working-directory: main
        run: |
          test -d "$THEOS/sdks/iPhoneOS26.5.sdk"
          grep -Eq '^TARGET[[:space:]]*:=[[:space:]]*iphone:clang:26\.5:15\.0' Makefile
          test "$(git -C "$THEOS/vendor/logos" rev-parse HEAD)" = "$RYG_LOGOS_REV"

      - name: Get version
        working-directory: main
        run: |
          VERSION="$(awk '/^Version:/ {print $2}' control)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup FFmpegKit
        working-directory: main
        run: ./scripts/setup-ffmpegkit.sh

      - name: Build rootless package
        working-directory: main
        shell: bash
        run: |
          set -o pipefail
          ./build.sh rootless 2>&1 | tee "$RUNNER_TEMP/ryg-rootless-build.log"

      - name: Name rootless artifact
        working-directory: main
        shell: bash
        run: |
          set -euo pipefail
          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' -print | head -n1)"
          test -n "$DEB"
          OUT="packages/RyukGram_${VERSION}+debug.${GITHUB_RUN_NUMBER}_rootless.deb"
          mv "$DEB" "$OUT"
          test -s "$OUT"
          ls -lh "$OUT"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RyukGram_debug_build_log_${{ github.run_number }}
          path: ${{ runner.temp }}/ryg-rootless-build.log
          if-no-files-found: ignore

      - name: Upload rootless package
        uses: actions/upload-artifact@v4
        with:
          name: RyukGram_debug_${{ env.VERSION }}_${{ github.run_number }}_rootless
          path: main/packages/RyukGram_*_rootless.deb
          if-no-files-found: error
