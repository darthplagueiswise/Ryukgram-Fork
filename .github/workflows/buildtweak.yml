name: Build RyukGram tweak

on:
  push:
    branches: [experimental]
  pull_request:
    branches: [experimental]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          path: main

      - run: brew install ldid dpkg make

      - run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - uses: actions/cache@v4
        id: SDK
        env:
          cache-name: iPhoneOS26.2.sdk
        with:
          path: ${{ github.workspace }}/theos/sdks/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS26.2.sdk
          git checkout
          mkdir -p "$THEOS/sdks"
          mv *.sdk "$THEOS/sdks"
        env:
          THEOS: ${{ github.workspace }}/theos

      - run: |
          cd main
          chmod +x scripts/*.sh build.sh modules/build-dev.sh || true
          scripts/validate-sdk26-liquidglass.sh
          ./scripts/setup-ffmpegkit.sh
          ./build.sh rootless
          ./build.sh rootful
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_PLATFORM_DEB_COMPRESSION_TYPE: lzma
          THEOS_PLATFORM_DEB_COMPRESSION_LEVEL: 9

      - uses: actions/upload-artifact@v4
        with:
          name: RyukGram-debs
          path: main/packages/*.deb
          if-no-files-found: error
