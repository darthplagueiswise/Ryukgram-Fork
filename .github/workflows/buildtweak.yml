name: Build RyukGram debug · rootless · SDK 26.5

on:
  push:
    branches: [debug]
  pull_request:
    branches: [debug]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Rootless · arm64 · SDK 26.5
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout debug source
        uses: actions/checkout@v4
        with:
          path: main
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Cache iPhoneOS 26.5 SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos/sdks/iPhoneOS26.5.sdk
          key: ${{ runner.os }}-iPhoneOS26.5.sdk-v1

      - name: Download iPhoneOS 26.5 SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs sdk-source
          cd sdk-source
          git sparse-checkout set --no-cone iPhoneOS26.5.sdk
          git checkout
          mv iPhoneOS26.5.sdk "$THEOS/sdks/"

      - name: Verify SDK 26.5 and Theos target
        working-directory: main
        run: |
          test -d "$THEOS/sdks/iPhoneOS26.5.sdk"
          grep -Eq '^TARGET[[:space:]]*:=[[:space:]]*iphone:clang:26\.5:15\.0' Makefile

      - name: Get version
        working-directory: main
        run: |
          VERSION="$(awk '/^Version:/ {print $2}' control)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup FFmpegKit
        working-directory: main
        run: ./scripts/setup-ffmpegkit.sh

      - name: Build rootless package
        working-directory: main
        shell: bash
        run: |
          set -o pipefail
          ./build.sh rootless 2>&1 | tee "$RUNNER_TEMP/ryg-rootless-build.log"

      - name: Name rootless artifact
        working-directory: main
        run: |
          DEB="$(ls -t packages/*_rootless.deb | head -n1)"
          test -n "$DEB"
          mv "$DEB" "packages/RyukGram_${VERSION}+debug.${GITHUB_RUN_NUMBER}_rootless.deb"
          ls -lh packages/RyukGram_*_rootless.deb

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RyukGram_debug_build_log_${{ github.run_number }}
          path: ${{ runner.temp }}/ryg-rootless-build.log
          if-no-files-found: ignore

      - name: Upload rootless package
        uses: actions/upload-artifact@v4
        with:
          name: RyukGram_debug_${{ env.VERSION }}_${{ github.run_number }}_rootless
          path: main/packages/RyukGram_*_rootless.deb
          if-no-files-found: error
