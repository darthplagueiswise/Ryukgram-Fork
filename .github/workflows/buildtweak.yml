name: Build RyukGram dogfood · SDK 26.5

on:
  push:
    branches: [dogfood]
  pull_request:
    branches: [dogfood]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Rootless + rootful · arm64
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout dogfood source
        uses: actions/checkout@v4
        with:
          path: main
          fetch-depth: 0

      - name: Install build and binary-analysis dependencies
        run: |
          brew untap aws/tap || true
          brew untap azure/bicep || true
          brew install ldid dpkg make radare2
          python3 -m venv "$RUNNER_TEMP/ryg-python"
          "$RUNNER_TEMP/ryg-python/bin/python" -m pip install --upgrade pip capstone lief r2pipe
          echo "$RUNNER_TEMP/ryg-python/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          r2 -v
          python3 - <<'PY'
          import capstone, lief, r2pipe
          print('capstone', capstone.__version__)
          print('lief', lief.__version__)
          print('r2pipe', getattr(r2pipe, '__version__', 'installed'))
          PY

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Cache iPhoneOS 26.5 SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos/sdks/iPhoneOS26.5.sdk
          key: ${{ runner.os }}-iPhoneOS26.5.sdk-v1

      - name: Download iPhoneOS 26.5 SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs sdk-source
          cd sdk-source
          git sparse-checkout set --no-cone iPhoneOS26.5.sdk
          git checkout
          mv iPhoneOS26.5.sdk "$THEOS/sdks/"

      - name: Verify SDK and migration contract
        working-directory: main
        run: |
          test -d "$THEOS/sdks/iPhoneOS26.5.sdk"
          test -f "$THEOS/sdks/iPhoneOS26.5.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIGlassEffect.h"
          grep -q 'UIGlassEffectStyleClear' "$THEOS/sdks/iPhoneOS26.5.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIGlassEffect.h"
          grep -q 'glassButtonConfiguration' "$THEOS/sdks/iPhoneOS26.5.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIButtonConfiguration.h"
          python3 scripts/validate-source.py
          bash -n build.sh build-fast.sh scripts/setup-ffmpegkit.sh

      - name: Setup FFmpegKit
        working-directory: main
        run: ./scripts/setup-ffmpegkit.sh

      - name: Build rootless package
        working-directory: main
        shell: bash
        run: |
          set -o pipefail
          ./build.sh rootless 2>&1 | tee "$RUNNER_TEMP/ryg-rootless-build.log"

      - name: Validate rootless dylib with LIEF, Capstone and radare2
        working-directory: main
        run: |
          DEB="$(ls -t packages/*_rootless.deb | head -n1)"
          test -n "$DEB"
          STAGE="$(mktemp -d)"
          dpkg-deb -x "$DEB" "$STAGE"
          DYLIB="$(find "$STAGE" -type f -name RyukGram.dylib | head -n1)"
          test -n "$DYLIB"
          python3 scripts/validate-macho.py "$DYLIB"
          r2 -2qc 'ij' "$DYLIB" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("bin",{}).get("arch") in ("arm","arm64"); print("radare2", d.get("bin",{}).get("arch"), d.get("bin",{}).get("bits"))'
          python3 - "$DYLIB" <<'PY'
          import r2pipe, sys
          r = r2pipe.open(sys.argv[1], flags=['-2'])
          info = r.cmdj('ij') or {}
          assert (info.get('bin') or {}).get('bits') == 64
          r.quit()
          print('r2pipe Mach-O check: PASS')
          PY
          test "$(find "$STAGE" -type f \( -name 'pluginsinject.dylib' -o -name 'zxPluginsInject.dylib' -o -name 'NoPluginsPatch.dylib' -o -name 'SideloadPatch.dylib' \) | wc -l | tr -d ' ')" = 0
          rm -rf "$STAGE"

      - name: Name rootless artifact
        working-directory: main
        run: |
          VERSION="$(awk '/^Version:/ {print $2}' control)"
          DEB="$(ls -t packages/*_rootless.deb | head -n1)"
          mv "$DEB" "packages/RyukGram_${VERSION}+dogfood.${GITHUB_RUN_NUMBER}_rootless.deb"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build rootful package
        working-directory: main
        shell: bash
        run: |
          set -o pipefail
          ./build.sh rootful 2>&1 | tee "$RUNNER_TEMP/ryg-rootful-build.log"

      - name: Validate rootful dylib with LIEF, Capstone and radare2
        working-directory: main
        run: |
          DEB="$(ls -t packages/*_rootful.deb | head -n1)"
          test -n "$DEB"
          STAGE="$(mktemp -d)"
          dpkg-deb -x "$DEB" "$STAGE"
          DYLIB="$(find "$STAGE" -type f -name RyukGram.dylib | head -n1)"
          test -n "$DYLIB"
          python3 scripts/validate-macho.py "$DYLIB"
          r2 -2qc 'ij' "$DYLIB" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("bin",{}).get("bits") == 64; print("radare2 rootful check: PASS")'
          test "$(find "$STAGE" -type f \( -name 'pluginsinject.dylib' -o -name 'zxPluginsInject.dylib' -o -name 'NoPluginsPatch.dylib' -o -name 'SideloadPatch.dylib' \) | wc -l | tr -d ' ')" = 0
          rm -rf "$STAGE"

      - name: Name rootful artifact
        working-directory: main
        run: |
          DEB="$(ls -t packages/*_rootful.deb | head -n1)"
          mv "$DEB" "packages/RyukGram_${VERSION}+dogfood.${GITHUB_RUN_NUMBER}_rootful.deb"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RyukGram_build_logs_${{ github.run_number }}
          path: |
            ${{ runner.temp }}/ryg-rootless-build.log
            ${{ runner.temp }}/ryg-rootful-build.log
          if-no-files-found: ignore

      - name: Upload dogfood packages
        uses: actions/upload-artifact@v4
        with:
          name: RyukGram_dogfood_${{ env.VERSION }}_${{ github.run_number }}
          path: |
            main/packages/RyukGram_*_rootless.deb
            main/packages/RyukGram_*_rootful.deb
          if-no-files-found: error
