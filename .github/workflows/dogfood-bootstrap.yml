name: Assemble dogfood migration asset

on:
  push:
    branches: [dogfood]

permissions:
  contents: write

jobs:
  assemble:
    if: contains(github.event.head_commit.message, '[bootstrap]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dogfood
          fetch-depth: 0
      - name: Assemble and verify exact upstream asset
        shell: bash
        run: |
          set -euo pipefail
          cat .dogfood-bootstrap/fbt_language_pack_ar.bin.part-* > src/BundleAssets/fbt_language_pack_ar.bin
          test "$(wc -c < src/BundleAssets/fbt_language_pack_ar.bin | tr -d ' ')" = 4330672
          echo "d248d5ec8b664e986e85c458b942c6eded32c949867d043eb20e954b4c7c5d3d  src/BundleAssets/fbt_language_pack_ar.bin" | sha256sum -c -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/BundleAssets/fbt_language_pack_ar.bin
          git commit -m "Assemble dogfood language asset [skip ci]"
          git push origin HEAD:dogfood
