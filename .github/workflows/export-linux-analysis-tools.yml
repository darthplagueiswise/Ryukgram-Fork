name: Export Linux analysis tools

on:
  push:
    branches: [ci/dogfood-live-runtime-rebuild-20260819-v3]
  pull_request:
    branches: [dogfood]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install binary analysis modules
        run: |
          python -m pip install --upgrade pip
          python -m pip install lief==1.0.0 capstone==5.0.9
          python - <<'PY'
          import lief, capstone
          print('lief', lief.__version__, lief.__file__)
          print('capstone', capstone.__version__, capstone.__file__)
          PY
      - name: Pack importable modules
        run: |
          python - <<'PY'
          import pathlib, shutil, lief, capstone
          out = pathlib.Path('/tmp/analysis-python')
          out.mkdir(parents=True, exist_ok=True)
          for module in (lief, capstone):
              path = pathlib.Path(module.__file__).resolve()
              source = path.parent if path.name == '__init__.py' else path
              dest = out / source.name
              if source.is_dir():
                  shutil.copytree(source, dest, dirs_exist_ok=True)
              else:
                  shutil.copy2(source, dest)
          print('\n'.join(str(p) for p in out.rglob('*')))
          PY
          tar -C /tmp/analysis-python -czf "$RUNNER_TEMP/analysis-site-packages.tgz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-py313-lief-capstone
          path: ${{ runner.temp }}/analysis-site-packages.tgz
